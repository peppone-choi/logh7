# 작성: 최병호 | evidence:guess | 로컬 리허설 구성
name: logh7
services:
  game-server:
    # 실제 Kotlin 이미지가 생긴 뒤에만 game 프로필을 활성화한다.
    image: ${GAME_SERVER_IMAGE:-logh7/game-server:unbuilt}
    profiles: [game]
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/logh7
      DATABASE_USER: logh7
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      PUBLIC_HOST: ${PUBLIC_HOST:-127.0.0.1}
      SESSION_PORT: ${SESSION_PORT:-47903}
    secrets: [postgres_password]
    ports:
      - "${GAME_BIND_IP:-127.0.0.1}:47900:47900"
      - "${GAME_BIND_IP:-127.0.0.1}:47902:47902"
      - "${GAME_BIND_IP:-127.0.0.1}:${SESSION_PORT:-47903}:${SESSION_PORT:-47903}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: logh7
      POSTGRES_USER: logh7
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    # PostgreSQL 18 공식 이미지의 버전별 PGDATA 상위 경로.
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U logh7 -d logh7"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.13.3
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=2GB"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [backend]
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_password]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [backend]
    logging: *logging

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
networks:
  backend:
