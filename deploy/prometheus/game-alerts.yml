# 작성: Peppone Choi | 체크리스트 14 장애 감지·알림 | evidence:guess (thresholds are operating policy)
# Inputs: the game server ops /metrics (server/ops-api OpsApi.opsMetrics), scraped as job="game-server".
groups:
  - name: logh7-game
    rules:
      - alert: LOGH7GameServerUnreachable
        expr: up{job="game-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'LOGH7 game server ops API unreachable'
          description: 'Prometheus cannot scrape {{ $labels.instance }} /metrics for one minute: process down, port closed or token rejected.'
      - alert: LOGH7EngineStorageFailed
        expr: logh7_engine_state{state="storage_failed"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'LOGH7 world engine storage failed'
          description: 'The world engine on {{ $labels.instance }} has reported a storage failure for one minute. It refuses new commands until restarted; check the state volume and the server log.'
      # engine_up is 0 while starting, stopped or after a storage failure; the last has its own alert above.
      # The 5m wait is the current alert condition, not a measured normal startup time.
      - alert: LOGH7EngineUnavailable
        expr: logh7_engine_up == 0 unless on(job, instance) logh7_engine_state{state="storage_failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 world engine not running'
          description: 'The world engine on {{ $labels.instance }} has been starting or stopped (engine_up 0, not a storage failure) for five minutes.'
      - alert: LOGH7BackupStale
        expr: >-
          logh7_backup_interval_seconds > 0
          and on(instance)
          (time() - ((logh7_backup_last_success_seconds > logh7_process_start_seconds) or logh7_process_start_seconds))
            > on(instance) 2 * logh7_backup_interval_seconds
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 live backup older than twice its interval'
          description: 'No successful live backup on {{ $labels.instance }} within 2x LOGH7_BACKUP_INTERVAL_MINUTES (RPO at risk).'
      - alert: LOGH7BackupFailing
        expr: increase(logh7_backup_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 live backup failed'
          description: 'At least one live backup failed in the last 15 minutes on {{ $labels.instance }}.'
      - alert: LOGH7HeapNearLimit
        expr: logh7_jvm_heap_used_bytes / logh7_jvm_heap_max_bytes > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 JVM heap above 90% of its limit'
          description: 'Heap use on {{ $labels.instance }} stayed above 90% for ten minutes; raise -Xmx or investigate growth.'
      - alert: LOGH7StateDiskLow
        expr: logh7_state_disk_free_bytes / logh7_state_disk_total_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 state volume under 10% free'
          description: 'The state volume of {{ $labels.instance }} has under 10% free space; journals and backups will fail when it fills.'
      - alert: LOGH7StateDiskCritical
        expr: logh7_state_disk_free_bytes < 1073741824
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'LOGH7 state volume under 1 GiB free'
          description: 'Under 1 GiB free on the state volume of {{ $labels.instance }}; a full volume stops the world engine.'
      # Repeated failures at the gateway (counts only). Windows and thresholds are operating policy.
      - alert: LOGH7LoginFailuresHigh
        expr: increase(logh7_login_rejected_total[10m]) >= 20
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 many rejected logins'
          description: 'At least 20 logins were rejected in ten minutes on {{ $labels.instance }} (password guessing or a broken account file).'
      - alert: LOGH7SessionTicketRejections
        expr: increase(logh7_session_ticket_rejected_total[10m]) >= 10
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 session tickets rejected'
          description: 'At least 10 session-port tickets were rejected in ten minutes on {{ $labels.instance }} (expired, reused or sent to the wrong session address).'
      - alert: LOGH7UpdateFailuresHigh
        expr: increase(logh7_update_failed_total[15m]) >= 5
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 update exchanges failing'
          description: 'At least 5 update exchanges started but did not complete in fifteen minutes on {{ $labels.instance }}.'
      - alert: LOGH7ConnectionErrorsHigh
        expr: increase(logh7_connection_errors_total[10m]) >= 50
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 many failed connections'
          description: 'At least 50 connections closed on protocol or handler errors in ten minutes on {{ $labels.instance }}.'
      # World actor lag (ActorTimingHistograms). p99 over 5 minutes; thresholds are operating policy.
      - alert: LOGH7ActorQueueLag
        expr: histogram_quantile(0.99, rate(logh7_actor_queue_age_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 world commands wait over 1s in the actor queue'
          description: 'The 99th percentile wait of world commands in the actor queue on {{ $labels.instance }} has been above one second for five minutes; players see slow responses.'
      - alert: LOGH7TickLagHigh
        expr: histogram_quantile(0.99, rate(logh7_actor_tick_dequeue_lag_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 world ticks run over 2s late'
          description: 'The 99th percentile delay between a scheduled world tick and its processing on {{ $labels.instance }} has been above two seconds for five minutes; the game clock and battles lag.'
      # Retention capacity (CaptureRetention, ops audit log). Thresholds are operating policy.
      - alert: LOGH7CaptureNearLimit
        expr: logh7_capture_bytes / logh7_capture_limit_bytes > 0.9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 packet capture near its retention limit'
          description: 'The packet capture on {{ $labels.instance }} has stayed above 90% of LOGH7_CAPTURE_MAX_MB for 30 minutes (live captures or a failing prune). Captures contain key exchanges: turn LOGH7_CAPTURE_DIR off when not diagnosing.'
      # Keep the audit gap visible even if the first scrape follows the failed append.
      - alert: LOGH7AuditWriteFailed
        expr: logh7_audit_write_failures_total{job="game-server"} > 0
        labels:
          severity: critical
        annotations:
          summary: 'LOGH7 operator audit write failed'
          description: 'An operator audit record on {{ $labels.instance }} could not be written or synced. Check the audit file and review the affected operation; this alert clears on process restart.'
      - alert: LOGH7AuditLogLarge
        expr: logh7_audit_file_bytes > 1073741824
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 operator audit log over 1 GiB'
          description: 'The operator audit log on {{ $labels.instance }} is over 1 GiB; archive it off the server and start a new file.'
      # A client fell so far behind that its pending world notifications overflowed and it was disconnected.
      - alert: LOGH7NotificationOverflow
        expr: increase(logh7_notification_overflow_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'LOGH7 client disconnected by a full notification queue'
          description: 'At least one client on {{ $labels.instance }} was disconnected in ten minutes because its pending world notifications passed 128 batches or 512 KiB (slow link or a stalled request).'