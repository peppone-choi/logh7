name: assets
on:
  push:
    paths: ['tools/assets/**', 'l10n/npc-*.json', 'tools/client/probe-model-loader.*', 'tools/client/test_model_probe.py', 'tools/l10n/msgdat.py', '.github/workflows/assets.yml']
  pull_request:
    paths: ['tools/assets/**', 'l10n/npc-*.json', 'tools/client/probe-model-loader.*', 'tools/client/test_model_probe.py', 'tools/l10n/msgdat.py', '.github/workflows/assets.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # upscale_assets·hud_sprite_map 검사용(로컬 개발 환경과 같은 판으로 고정)
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 pillow==12.1.1 opencv-python-headless==4.13.0.92
      - run: python -B -m unittest discover -s tools/assets -v
      - run: node tools/assets/test_npc_catalogue.js
      - run: python -B -m unittest discover -s tools/client -p test_model_probe.py -v
