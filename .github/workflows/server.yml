name: server
on:
  push:
    paths: ['server/**', 'config/countries/**', 'tools/l10n/editor*', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'config/countries/**', 'tools/l10n/editor*', '.github/workflows/server.yml']
permissions:
  contents: read
jobs:
  country-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: logh7_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: logh7_test
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f server/persistence/src/main/resources/db/migration/V1__national_definitions.sql -f server/persistence/src/test/resources/sql/national_definitions_test.sql
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :persistence:test --tests '*PostgresCountryColorsTest' --no-daemon
        working-directory: server
        env:
          LOGH7_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/logh7_test
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-junit-results
          path: server/*/build/test-results/test/*.xml
          if-no-files-found: error
          retention-days: 7
