name: container
on:
  push:
    paths: ['server/**', 'deploy/docker-compose.yml', 'docs/manual/data/**', '.github/workflows/container.yml']
  pull_request:
    paths: ['server/**', 'deploy/docker-compose.yml', 'docs/manual/data/**', '.github/workflows/container.yml']
permissions:
  contents: read
jobs:
  game-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: logh7-ci-${{ github.run_id }}-${{ github.run_attempt }}
      GAME_SERVER_IMAGE: logh7/game-server:ci
    steps:
      - uses: actions/checkout@v4
      - name: Build Java 25 image
        run: docker build --build-context logh7-manual-data=docs/manual/data -t "$GAME_SERVER_IMAGE" server
      - name: Verify packaged manual CSV resources
        run: |
          cid=$(docker create "$GAME_SERVER_IMAGE")
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/image-lib"
          docker cp "$cid:/app/lib/." "$RUNNER_TEMP/image-lib"
          python3 - <<'PYCODE'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import re
          import zipfile

          jars = list((Path(os.environ['RUNNER_TEMP']) / 'image-lib').glob('engine-*.jar'))
          assert len(jars) == 1, f'Expected one engine jar, found {len(jars)}'
          expected = set(re.findall(r'"([^"/]+\.csv)"', Path('server/engine/build.gradle.kts').read_text()))
          assert 'strategy-commands.csv' in expected
          with zipfile.ZipFile(jars[0]) as jar:
              entries = [entry for entry in jar.infolist() if entry.filename.endswith('.csv')]
              names = [PurePosixPath(entry.filename).name for entry in entries]
              assert len(names) == len(set(names)), f'Duplicate CSV basenames: {names}'
              assert set(names) == expected, f'Packaged CSVs {set(names)} != Gradle includes {expected}'
              for entry in entries:
                  path = PurePosixPath(entry.filename)
                  directory = 'strategy' if path.name == 'strategy-commands.csv' else 'worldseed'
                  assert path.parent == PurePosixPath(directory), f'Unexpected CSV path: {path}'
                  packaged = jar.read(entry)
                  source = (Path('docs/manual/data') / path.name).read_bytes()
                  assert packaged == source, f'CSV bytes differ: {path}'
                  print(f'{path} sha256={hashlib.sha256(packaged).hexdigest()[:16]}')
              print(f'Verified manual CSV resources: {len(entries)}')
          PYCODE
      - name: Validate Compose contract
        run: |
          docker compose -f deploy/docker-compose.yml --profile game config --format json > /tmp/compose.json
          python3 - <<'PYCODE'
          import json
          game = json.load(open('/tmp/compose.json'))['services']['game-server']
          assert game['build']['additional_contexts']['logh7-manual-data'].endswith('/docs/manual/data')
          assert all(key.startswith('LOGH7_') for key in game['environment'])
          assert not game.get('ports')  # Loopback listeners are container-internal only.
          assert not game.get('depends_on') and not game.get('secrets')
          PYCODE
          test "$(docker image inspect --format '{{.Config.User}}' "$GAME_SERVER_IMAGE")" = '10001:10001'
          docker run --rm --entrypoint bash "$GAME_SERVER_IMAGE" -ec '
            test "$(id -u)" = 10001
            test -z "$(find /app /data -iname "*accounts*" -o -name "E:" -o -iname "*.pcap*")"
            test -z "$(find /data -type f)"
          '
      - name: Start game service and wait for health
        run: docker compose -f deploy/docker-compose.yml --profile game up -d --no-build --wait --wait-timeout 120 game-server
      - name: Check health HTTP 200 and internal loopback TCP listeners
        run: |
          docker compose -f deploy/docker-compose.yml --profile game exec -T game-server bash -ec '
            exec 3<>/dev/tcp/127.0.0.1/47901
            printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
            IFS= read -r status <&3
            [[ "$status" == *" 200 "* ]]
            echo "$status"
          '
          # Gateway policy permits loopback, not a Docker bridge address.
          docker compose -f deploy/docker-compose.yml --profile game exec -T game-server bash -ec '
            for port in 47900 47902 47903; do
              (exec 3<>/dev/tcp/127.0.0.1/$port)
              echo "Internal loopback TCP $port: accepted"
            done
          '
      - name: Diagnostics
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml --profile game ps -a
          docker compose -f deploy/docker-compose.yml --profile game logs --no-color
      - name: Remove isolated CI containers and volumes
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml --profile game down -v --remove-orphans
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
