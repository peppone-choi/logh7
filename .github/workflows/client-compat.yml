name: client-compat
on:
  push:
    paths: ['client-compat/**', 'config/countries/**', 'l10n/**', 'tools/l10n/country_catalog.py', 'tools/l10n/test_country_catalog.py', 'tools/l10n/test_command_labels.py', 'tools/l10n/editor*', 'tools/l10n/test_editor.js', 'tools/client/run-background.py', 'tools/client/qa_login_relay.py', 'tools/client/test_qa_login_relay.py', '.github/workflows/client-compat.yml']
  pull_request:
    paths: ['client-compat/**', 'config/countries/**', 'l10n/**', 'tools/l10n/country_catalog.py', 'tools/l10n/test_country_catalog.py', 'tools/l10n/test_command_labels.py', 'tools/l10n/editor*', 'tools/l10n/test_editor.js', 'tools/client/run-background.py', 'tools/client/qa_login_relay.py', 'tools/client/test_qa_login_relay.py', '.github/workflows/client-compat.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tools/l10n -p test_country_catalog.py -v
      - run: python -B -m unittest discover -s tools/l10n -p test_command_labels.py -v
      - run: node --test tools/l10n/test_editor.js
      - run: python -B -m unittest discover -s tools/client -p test_qa_login_relay.py -v
      - name: Build x86 proxy and check rejection outside the supported client
        shell: pwsh
        run: ./client-compat/build.ps1 -OutDir "$pwd/work/compat-build"
      - uses: actions/upload-artifact@v4
        with:
          name: logh7-client-compat-windows-x86
          path: work/compat-build/dinput8.dll
