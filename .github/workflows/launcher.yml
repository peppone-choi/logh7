name: launcher
on:
  push:
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: logh7-launcher-windows
          path: |
            launcher/target/release/logh7-launcher.exe
            launcher/launcher.ini.example
